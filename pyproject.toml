[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sdcf-engine-v4"
version = "4.0.0"
description = "A controlled clean-room implementation of a stochastic discounted cash-flow engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.1",
    "pandas==3.0.5",
    "PyYAML==6.0.3",
    "scipy==1.18.0",
    "statsmodels==0.14.6",
]

[project.scripts]
sdcf-v4 = "sdcf_engine.cli:main"

[dependency-groups]
dev = [
    "mypy==1.20.2",
    "pandas-stubs==2.3.3.260113",
    "pytest==8.4.2",
    "ruff==0.15.22",
    "scipy-stubs==1.18.0.1",
    "types-PyYAML==6.0.12.20260518",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sdcf_engine = ["py.typed"]

[tool.uv]
required-version = "==0.11.31"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "D", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true

[[tool.mypy.overrides]]
module = ["statsmodels.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
xfail_strict = true
